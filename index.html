<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blackboard AI Support Assistant</title>

  <style>

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f5f5f5;
    }

    .header{
      background:#111827;
      color:white;
      padding:20px;
      text-align:center;
      font-size:24px;
      font-weight:bold;
    }

    .content{
      padding:40px;
      text-align:center;
    }

    #chat-container{
      width:400px;
      height:700px;
      margin:30px auto;
      background:white;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 4px 20px rgba(0,0,0,0.2);
    }

    @media(max-width:768px){

      #chat-container{
        width:100%;
        height:100vh;
        margin:0;
        border-radius:0;
      }

    }

  </style>
</head>

<body>

  <div class="header">
    Blackboard AI Support Assistant
  </div>

  <div class="content">
    <h1>Welcome</h1>
    <p>Ask questions and get instant AI-powered support.</p>
  </div>

  <div id="chat-container"></div>

  <!-- Kore.ai Widget Script -->
  <script src="https://widget.kore.ai/v1/loader.js"></script>

  <script>

    window.onload = function () {

      if(window.KoreWidget){

        KoreWidget.init({

          appId: "aa-eef97655-7509-4d62-9a32-c70da75adc6d",

          apiKey: "kg-eb85bc05-a6be-4f55-8ca1-23d7f22f7fd7.e9d435e4-6f93-4e12-8111-fc887d7a48b1",

          containerId: "chat-container",

          theme: "light",

          botName: "Blackboard AI Support Assistant",

          greeting: "Hello! How can I help you today?",

          position: "bottom-right"

        });

      } else {

        console.error("KoreWidget failed to load");

      }

    };

  </script>

</body>
</html>
